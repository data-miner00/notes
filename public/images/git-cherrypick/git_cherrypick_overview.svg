<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Git cherry-pick: copying a commit from one branch to another</title>
  <desc>Shows a main branch and a feature branch. Commit C on the feature branch is cherry-picked onto main as C'.</desc>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
    .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="680" height="320" fill="#ffffff"/>

  <!-- main branch line -->
  <line x1="60" y1="100" x2="600" y2="100" stroke="#888780" stroke-width="2"/>
  <!-- feature branch fork line (vertical) -->
  <line x1="200" y1="100" x2="200" y2="230" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- feature branch line -->
  <line x1="200" y1="230" x2="520" y2="230" stroke="#888780" stroke-width="2"/>

  <!-- Branch labels -->
  <text class="th" x="52" y="88">main</text>
  <text class="th" x="210" y="248">feature</text>

  <!-- Commit A (gray) -->
  <circle cx="120" cy="100" r="18" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="120" y="100" text-anchor="middle" dominant-baseline="central">A</text>

  <!-- Commit B (gray) -->
  <circle cx="200" cy="100" r="18" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="200" y="100" text-anchor="middle" dominant-baseline="central">B</text>

  <!-- Commit D (gray) -->
  <circle cx="400" cy="100" r="18" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="400" y="100" text-anchor="middle" dominant-baseline="central">D</text>

  <!-- Commit C' on main (teal — the cherry-picked copy) -->
  <circle cx="510" cy="100" r="18" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text class="th" x="510" y="100" text-anchor="middle" dominant-baseline="central" fill="#085041">C'</text>

  <!-- Feature commit X (gray) -->
  <circle cx="300" cy="230" r="18" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="300" y="230" text-anchor="middle" dominant-baseline="central">X</text>

  <!-- Commit C — being picked (amber) -->
  <circle cx="410" cy="230" r="18" fill="#FAC775" stroke="#BA7517" stroke-width="1.5"/>
  <text class="th" x="410" y="230" text-anchor="middle" dominant-baseline="central" fill="#633806">C</text>

  <!-- Feature commit Y (gray) -->
  <circle cx="510" cy="230" r="18" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="510" y="230" text-anchor="middle" dominant-baseline="central">Y</text>

  <!-- Cherry-pick arrow -->
  <path d="M410 212 Q460 155 492 112" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="ts" x="470" y="158" text-anchor="middle" fill="#1D9E75">cherry-pick</text>

  <!-- Legend -->
  <circle cx="52" cy="295" r="7" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text class="ts" x="64" y="299">commit being picked</text>
  <circle cx="190" cy="295" r="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="202" y="299">resulting copy on main</text>
</svg>